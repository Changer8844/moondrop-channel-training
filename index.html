<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="MOONDROP offline channel product training portal" />
  <title>MOONDROP · Channel Training</title>
  <link rel="stylesheet" href="styles.css?v=20260826a" />
  <link rel="stylesheet" href="auth.css?v=20260826a" />
  <script defer src="catalog.js"></script>
  <script defer src="auth.js?v=20260826a"></script>
  <script defer src="app.js?v=20260826a"></script>
</head>
<body>
  <a class="skip-link" href="#categoryGrid">Skip to categories</a>
  <div class="site-shell">
    <header class="topbar">
      <div class="brand-lockup" aria-label="MOONDROP">
        <span class="orbit-mark" aria-hidden="true"></span>
        <span class="brand-copy">
          <span class="brand-name">MOONDROP</span>
          <span class="brand-kicker" id="brandKicker">CHANNEL TRAINING</span>
        </span>
      </div>
      <div class="topbar-actions">
        <button class="auth-login-button" id="loginButton" type="button" aria-haspopup="dialog" aria-controls="authDialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="1.5" />
            <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" />
          </svg>
          <span id="loginButtonLabel">LOGIN</span>
        </button>
        <button class="language-toggle" id="languageToggle" type="button" aria-label="切换至中文" aria-pressed="false">
          <span class="language-option" data-language-option="zh">中文</span>
          <span class="language-divider" aria-hidden="true">/</span>
          <span class="language-option active" data-language-option="en">EN</span>
        </button>
      </div>
    </header>

    <main class="portal">
      <section class="portal-intro" aria-labelledby="pageTitle">
        <div>
          <div class="intro-kicker">MOONDROP · 2015—2026</div>
          <h1 class="intro-title" id="pageTitle">Channel<br />Training</h1>
        </div>
        <div class="intro-lower">
          <p class="tagline" id="tagline">Always in music. Always on the journey.</p>
          <div class="select-category" id="selectCategory">Select a product category</div>
        </div>
        <span class="listening-mark" aria-hidden="true"></span>
      </section>

      <section class="category-wall" aria-label="Product training categories">
        <div class="category-grid" id="categoryGrid"></div>
      </section>
    </main>
  </div>

  <div class="auth-gate" id="authDialog" aria-hidden="true">
    <div class="auth-gate__backdrop" data-auth-close aria-hidden="true"></div>
    <section class="auth-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button class="auth-card__close" id="authClose" type="button" aria-label="Close login">×</button>
      <div class="auth-card__kicker" id="authKicker">CHANNEL ACCESS</div>
      <h2 class="auth-card__title" id="authTitle">Enter the training portal</h2>
      <form class="auth-form" id="authForm" novalidate>
        <label class="auth-form__label" for="authPassword" id="authPasswordLabel">Password</label>
        <div class="auth-form__field">
          <input id="authPassword" name="password" type="password" autocomplete="off" spellcheck="false" required />
          <button class="auth-form__reveal" id="authReveal" type="button" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z" />
              <circle cx="12" cy="12" r="2.3" />
            </svg>
          </button>
        </div>
        <p class="auth-form__message" id="authMessage" role="alert" aria-live="polite"></p>
        <div class="auth-form__actions">
          <button class="auth-form__cancel" id="authCancel" type="button">Cancel</button>
          <button class="auth-form__submit" id="authSubmit" type="submit">Enter training</button>
        </div>
      </form>
      <p class="auth-card__note" id="authNote">Access is remembered on this browser for 12 hours.</p>
    </section>
  </div>

  <section class="category-overlay" id="categoryOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Product category training">
    <div class="overlay-visual">
      <img id="overlayImage" src="assets/categories/true-wireless.jpg" alt="" />
      <div class="overlay-product-lineup" id="overlayProductLineup" aria-hidden="true"></div>
      <div class="overlay-visual__copy">
        <div class="overlay-kicker" id="overlayKicker">CHANNEL TRAINING</div>
        <h2 class="overlay-title" id="overlayTitle">True Wireless</h2>
        <p class="overlay-description" id="overlayDescription"></p>
      </div>
    </div>
    <div class="overlay-panel">
      <div class="overlay-tools" aria-label="Category navigation">
        <a class="overlay-home-link" id="overlayHomeLink" href="./index.html?lang=en" aria-label="Training home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 10.5 12 3.8l8.5 6.7" />
            <path d="M5.8 9.2v10.4h12.4V9.2" />
            <path d="M9.4 19.6v-6.2h5.2v6.2" />
          </svg>
        </a>
        <button class="language-toggle overlay-language-toggle" id="overlayLanguageToggle" type="button" aria-label="切换至中文" aria-pressed="false">
          <span class="language-option" data-language-option="zh">中文</span>
          <span class="language-divider" aria-hidden="true">/</span>
          <span class="language-option active" data-language-option="en">EN</span>
        </button>
        <button class="overlay-close" id="closeOverlay" type="button" aria-label="Close category">×</button>
      </div>
      <div class="overlay-products" id="overlayProducts"></div>
    </div>
  </section>

  <noscript><p class="noscript">JavaScript is required to open the product training categories.</p></noscript>
</body>
</html>
